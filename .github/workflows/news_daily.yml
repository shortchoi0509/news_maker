name: Daily News Pipeline

on:
  workflow_dispatch:
    inputs:
      do_podcast_en:
        description: "Generate English podcast? (1=yes, 0=no)"
        required: false
        default: "0"
  schedule:
    - cron: "30 15 * * *"  # 매일 KST 00:30 (UTC 15:30)

permissions:
  contents: write

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Auto Script to generate Markdown
        run: python auto_run.py
        env:
          DO_PODCAST_EN: ${{ github.event.inputs.do_podcast_en || '0' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Generate HTML from Markdown
        run: python generate_html.py

      - name: Get Current Date (KST)
        id: date
        run: |
          echo "TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Send Email with Today's Files
        if: ${{ env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "📅 오늘의 뉴스 요약 리포트: ${{ env.TODAY }}"
          to: ${{ secrets.MAIL_TO }}
          from: 최재훈
          body: |
            안녕하세요!
            오늘(${{ env.TODAY }}) 생성된 뉴스 리포트를 첨부파일로 공유해 드립니다.
          attachments: |
            out/${{ env.TODAY }}/**/*.html
            out/${{ env.TODAY }}/**/*.md
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

      - name: Sync with remote main (rebase)
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "ci-artifacts" || true
          git fetch origin main
          git rebase origin/main
          git stash pop || true

      - name: Commit & Push results
        uses: EndBug/add-and-commit@v9
        with:
          add: "out"
          message: "feat: Add daily news artifacts (MD & HTML) ${{ env.TODAY }}"
          default_author: github_actions
