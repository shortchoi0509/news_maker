name: Daily News Pipeline (Claude)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"  # 매일 KST 00:30 (UTC 15:30)

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml lxml_html_clean newspaper3k markdown

      - name: Get Current Date (KST)
        id: date
        run: echo "TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Scrape mk.co.kr articles
        run: python _run_scrape.py

      - name: Run Claude to summarize and build daily brief
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            오늘(${{ env.TODAY }})의 매일경제 기사를 한국어로 요약해 데일리 브리프를 만든다.

            입력:
            - 스크랩된 기사 JSON: /tmp/scraped_${{ env.TODAY }}.json
            - 각 항목: {url, title, text}

            작업:
            1. 모든 기사를 빠짐없이 처리(샘플링 금지).
            2. 단일 통합 마크다운 파일을 생성: out/${{ env.TODAY }}/SUMMARY_KO/daily_brief_${{ env.TODAY }}.md
               - 상단 frontmatter(title, date, articles 개수)
               - 목차
               - 각 기사: ## NN. 제목 / 카테고리·원문 링크 / 요약 / 주요 인용·수치 / 배경·맥락 / 전망 / 시사점 / 용어 정리
               - 모든 요약·해설은 한국어로 작성
               - 외부 LLM API 호출 금지 — 내가 직접 요약을 생성
            3. python generate_html.py 를 실행해 HTML도 함께 생성.
            4. 결과 파일들을 git add 후 commit (메시지: "feat: Daily news ${{ env.TODAY }}") 후 push.

            제약:
            - 절대 외부 LLM API(OpenAI 등)를 호출하지 말 것.
            - news_maker.news_parse_and_archive / auto_run.py 를 사용하지 말 것 (그 경로는 GPT-5 의존).
            - 결과 검증: 마크다운 파일이 존재하고 1KB 이상인지 확인.
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"

      - name: Verify outputs exist
        run: |
          set -e
          MD="out/${TODAY}/SUMMARY_KO/daily_brief_${TODAY}.md"
          if [ ! -s "$MD" ]; then
            echo "::error::Daily brief markdown is missing or empty: $MD"
            exit 1
          fi
          echo "Brief lines: $(wc -l < "$MD")"
          ls -la "out/${TODAY}/" || true
