name: Daily News Pipeline (Claude)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"  # 매일 KST 00:30 (UTC 15:30)

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml lxml_html_clean markdown

      - name: Get Current Date (KST)
        run: echo "TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Scrape mk.co.kr articles (parallel)
        env:
          SCRAPE_WORKERS: "8"
        run: python _run_scrape.py

      - name: Stage scraped JSON into repo
        run: |
          mkdir -p "out/${TODAY}"
          cp "/tmp/scraped_${TODAY}.json" "out/${TODAY}/scraped.json"
          echo "Articles: $(python -c "import json;print(len(json.load(open('out/${TODAY}/scraped.json'))))")"

      - name: Configure git for bot commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Claude to summarize and build daily brief
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          timeout_minutes: "45"
          direct_prompt: |
            오늘(${{ env.TODAY }})의 매일경제 데일리 브리프를 만든다. 외부 LLM API 호출 금지 — 모든 요약·해설은 네가 직접 한국어로 작성한다.

            절대 규칙 — 작성 주체:
            - daily_brief / email_brief 의 모든 텍스트(목차·요약·전망·시사점·"오늘의 한눈에 보기")는
              반드시 네가 직접 기사 본문을 읽고 작성한다.
            - 저장소에 있는 기존 .py 스크립트로 요약·브리프를 생성하지 말 것.
              마크다운 생성에 스크립트를 쓰면 제목만 복사한 빈약한 템플릿이 나온다 — 금지.
            - 실행이 허용된 스크립트는 generate_html.py 단 하나뿐이다(HTML 변환 용도).

            입력:
            - 스크랩된 기사 JSON: out/${{ env.TODAY }}/scraped.json
            - 각 항목 형식: {url, title, text}

            작업 순서:
            1. JSON에 있는 모든 기사를 빠짐없이 처리(샘플링·생략 금지).
            2. 단일 통합 마크다운을 다음 경로에 작성:
               out/${{ env.TODAY }}/SUMMARY_KO/daily_brief_${{ env.TODAY }}.md
               형식:
               - frontmatter: title / date / articles 개수
               - 상단 목차: 번호 + 굵게 표기된 제목
               - 목차 바로 다음, 첫 기사 앞에 종합 개관 섹션을 정확히 다음 형식으로 작성:
                 ## 오늘의 한눈에 보기
                 (전체 기사를 통합 컨텍스트로 보고 작성하는 한 편의 신문 데스크 브리핑.
                  주제별로 4~7개 단락으로 묶고, 각 단락은 4~6문장. 단락 마지막에는
                  관련 기사 번호를 [#3, #7, #12] 형식으로 인라인 참조하되, 단락 하나에
                  가능한 많은 기사(보통 3~6개) 를 묶는다.
                  **커버리지 규칙 — 이 브리프에 들어간 모든 기사가 한눈에 보기의 어느
                  단락에 [#N] 으로 반드시 한 번은 등장해야 한다.** 누락된 기사 번호가
                  있으면 그 주제를 다루는 단락을 추가하거나 기존 단락에 그 기사를
                  엮어 넣는다. "이 외에도 ~기사가 보도되었다" 식 한 줄 처리 금지 —
                  반드시 그 기사들의 실제 내용을 문장 안에 녹여서 서술한다.
                  어떤 흐름·갈등·신호가 오늘 기사 묶음에서 보이는지 평이한 한국어
                  평문으로. 본문에 명시된 사실만 사용하고 추측·평가성 멘트 금지.
                  이 섹션은 "오늘의 한눈에 보기" 단 1회만 등장하며 부제·아이콘·이모지
                  사용 금지.
                  반드시 실제 사건·수치·동향을 문장으로 풀어쓴다 —
                  "경제 분야에서 [#1,#2] 등 N건이 보도되었다" 처럼 기사 건수를 세거나
                  번호만 나열하는 요약은 금지. 각 단락은 그 주제에서 오늘 무슨 일이
                  일어났는지를 구체적으로 설명해야 한다.)
               - 각 기사 본문은 정확히 다음 3개 섹션만 사용 (다른 섹션 추가/제거 금지):
                 ## NN. 제목
                 `카테고리` · [원문 보기](URL)
                 ### 요약
                 (본문 핵심을 반드시 3문장 이상 9문장 이하로 압축. 2문장 이하로 끝내지 말 것 —
                  기사에 담긴 수치·주체·배경·맥락을 충분히 풀어쓴다. 원문에 명시된 사실만 사용,
                  자체 해석·평가 금지. 제목을 그대로 옮겨 적거나 "~에 대한 주요 내용입니다" 식의
                  내용 없는 문장으로 채우는 것 금지.)
                 ### 전망
                 (원문에서 미래 시점 표현을 적극적으로 찾아 그 일정·예상·계획을 옮긴다.
                  찾을 단서: "예정", "계획", "추진", "내년", "내달", "하반기", "~할 것",
                  "~할 예정이다", "~로 보인다", "~까지", "~앞두고". 이런 단서가 본문에
                  있으면 반드시 1~2문장으로 옮긴다. 정말로 단서가 0개일 때만
                  "(원문에 명시된 전망 없음)"으로 표기. 한 브리프의 모든 기사에서
                  전망이 비어 있는 일은 비정상이므로 다시 본문을 확인할 것.)
                 ### 시사점
                 (이 기사가 독자에게 주는 의미를 1~2문장으로. 반드시 그 기사 고유의
                  주체·수치·결과를 가리키는 문장이어야 한다. 두 기사 이상에서 같거나
                  거의 같은 시사점을 쓰면 그 브리프는 실패다.
                  절대 금지 어구 — "사회 안전망 강화", "제도적 개선", "구조적 개혁",
                  "국가 경쟁력 강화", "경제 정책의 실효성", "재정 정책의 투명성",
                  "국제 정세 변화에 대한 능동적 대응", "관련 업계와 시장에 영향을
                  미칠 것으로 보입니다" 같은 카테고리별 정형 문구. 이런 일반론은
                  어느 기사에든 붙는 클리셰라서 정보가 0이다.)

            3. **품질 규칙 — 위반 시 해당 섹션을 빈 줄 처리하더라도 어기지 말 것:**
               - 동일/거의 동일한 문장을 두 기사 이상에서 재사용 금지 (특히 시사점 — "투자자들의 포트폴리오 전략 조정이 필요…", "시장 변동성에 주의…" 같은 일반 멘트 절대 금지).
               - 같은 섹션 안에서 같은 문장 반복 금지.
               - 본문에 없는 숫자·고유명사·인용 만들어내지 말 것.
               - 본문 문장을 통째로 복사해 채우지 말 것 — 항상 자기 말로 압축.
               - 이모지(📈📉🧐🚀 등) 사용 금지. 깔끔한 평문으로만 작성.
               - "오늘의 한눈에 보기" 단락은 일반론·시황 클리셰("변동성 확대에 주의" 같은) 금지. 반드시 오늘 기사들에 등장한 사실과 흐름에 근거할 것.

            4. 핵심 뉴스 선별판 마크다운을 다음 경로에 작성:
               out/${{ env.TODAY }}/SUMMARY_KO/email_brief_${{ env.TODAY }}.md
               - 전체 기사 중 "독자가 오늘 반드시 알아야 할" 핵심 기사만 10~15개 선별
                 (그날 뉴스의 양·중요도에 따라 10~15 사이에서 가변).
               - 선별 기준: 시장·경제 전반에 미치는 영향, 정책·제도 변화, 큼직한
                 사건·전환점. 단순 개별 종목 등락, 지엽적 인사, 홍보성 기사는 제외.
               - 형식은 daily_brief 와 동일(frontmatter / 목차 / ## 오늘의 한눈에 보기 /
                 기사별 ## NN. 제목 + 요약/전망/시사점). 단:
                 - frontmatter title 은 "매일경제 핵심 브리프", articles 는 선별된 개수.
                 - 선별된 기사는 1번부터 새로 번호를 매기고 "오늘의 한눈에 보기"의
                   [#N] 참조도 이 새 번호 기준으로 맞출 것.
                 - 각 기사 요약/전망/시사점 내용은 daily_brief 에서 작성한 것을 그대로
                   재사용(다시 쓰지 말 것). "오늘의 한눈에 보기"는 선별 기사 흐름에
                   맞춰 새로 작성하되 위 품질 규칙을 동일하게 적용.
                 - email_brief 의 "오늘의 한눈에 보기" 는 선별된 모든 기사를 빠짐없이
                   다룬다 — 선별 기사 1번부터 마지막 번호까지 전부 한눈에 보기 단락
                   어딘가에 [#N] 으로 등장해야 한다. 단락 4~7개, 각 단락에 3~6개
                   기사를 묶어 흐름을 서술. 누락 기사 0개가 목표.

            5. python generate_html.py 를 실행해 HTML도 생성 (daily_brief, email_brief 둘 다 변환됨).
            6. git add out/${{ env.TODAY }} && git commit -m "feat: Daily news ${{ env.TODAY }}" 후
               git fetch origin main && git rebase origin/main && git push origin main
               (충돌 시 rebase --abort 후 git pull --rebase origin main 재시도)
            7. 최종 검증: daily_brief 와 email_brief 마크다운이 모두 존재하고 daily_brief 는 5KB 이상인지 확인.

            제약:
            - 절대 OpenAI / DeepSeek / 기타 외부 LLM API 호출 금지.

      - name: Verify outputs exist
        run: |
          set -e
          MD="out/${TODAY}/SUMMARY_KO/daily_brief_${TODAY}.md"
          EMAIL_MD="out/${TODAY}/SUMMARY_KO/email_brief_${TODAY}.md"
          if [ ! -s "$MD" ]; then
            echo "::error::Daily brief markdown is missing or empty: $MD"
            exit 1
          fi
          SIZE=$(stat -c%s "$MD")
          echo "Brief size: ${SIZE} bytes, lines: $(wc -l < "$MD")"
          if [ "$SIZE" -lt 5120 ]; then
            echo "::error::Daily brief is suspiciously small (< 5KB): ${SIZE}"
            exit 1
          fi
          if [ ! -s "$EMAIL_MD" ]; then
            echo "::warning::Email brief markdown missing; email will fall back to full daily brief"
          else
            echo "Email brief size: $(stat -c%s "$EMAIL_MD") bytes"
          fi
          ls -la "out/${TODAY}/" || true

      - name: Verify SUMMARY_KO is clean
        run: |
          set -e
          DIR="out/${TODAY}/SUMMARY_KO"
          if [ ! -d "$DIR" ]; then
            echo "::error::$DIR not found"
            exit 1
          fi
          UNEXPECTED=$(find "$DIR" -maxdepth 1 -type f -name "*.md" \
            ! -name "daily_brief_${TODAY}.md" \
            ! -name "email_brief_${TODAY}.md" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected .md files in $DIR — a per-article summarization script likely ran. Pipeline must produce only daily_brief / email_brief:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "SUMMARY_KO clean: only daily_brief and email_brief present"

      - name: Verify Korean text integrity
        run: |
          set -e
          MD="out/${TODAY}/SUMMARY_KO/daily_brief_${TODAY}.md"
          EMAIL_MD="out/${TODAY}/SUMMARY_KO/email_brief_${TODAY}.md"
          BRIEFS="$MD"
          [ -s "$EMAIL_MD" ] && BRIEFS="$BRIEFS $EMAIL_MD"
          python _verify_brief.py $BRIEFS

      - name: Send daily brief via Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python _send_email.py
