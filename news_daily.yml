name: Daily News Pipeline (Toggle)

on:
  workflow_dispatch:
    inputs:
      do_podcast_en:
        description: "Generate English podcast? (1=yes, 0=no)"
        required: false
        default: "0"
  schedule:
    - cron: "30 15 * * *"  # 매일 KST 00:30 (UTC 15:30)

permissions:
  contents: write  # GITHUB_TOKEN으로 커밋/푸시 허용

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install .

      - name: Run Auto Script to generate Markdown
        run: python auto_run.py
        env:
          DO_PODCAST_EN: ${{ github.event.inputs.do_podcast_en || '0' }}

      - name: Generate HTML from Markdown
        run: python generate_html.py

      # 1. 한국 시간(KST) 기준으로 오늘 날짜 변수 생성
      - name: Get Current Date (KST)
        id: date
        run: |
          echo "TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 2. 이메일 발송 (여러 명에게 전송)
      - name: Send Email with Today's Files
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          # 직접 입력하는 방식 (비공개 저장소용)
          username: "shortchoi0509@gmail.com"
          password: "homw zrtt iuzr qnri"
          
          subject: "📅 오늘의 뉴스 요약 리포트: ${{ env.TODAY }}"
          # ✅ 여러 명에게 보낼 때: 쉼표(,)로 구분하세요.
          to: "songminkyuv@naver.com, shortchoi0509@gmail.com, wogns0509@korea.ac.kr, tallchoi0604@gmail.com, moonarang@kdi.re.kr, hillmsky@naver.com"
          from: 최재훈
          body: |
            안녕하세요!
            오늘(${{ env.TODAY }}) 생성된 뉴스 리포트를 첨부파일로 공유해 드립니다.
          
          
          # 오늘 날짜 폴더 하위의 파일만 첨부
          attachments: |
            out/${{ env.TODAY }}/**/*.html
            out/${{ env.TODAY }}/**/*.md


      # ✅ 핵심: 커밋/푸시 전에 원격 main과 동기화 (non-fast-forward 방지)
      - name: Sync with remote main (rebase)
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 작업트리 변경(생성물)을 잠깐 숨기고 원격 최신을 rebase로 당겨옴
          git stash push -u -m "ci-artifacts" || true
          git fetch origin main
          git rebase origin/main
          git stash pop || true

      - name: Commit & Push results
        uses: EndBug/add-and-commit@v9
        with:
          add: "out"
          message: "feat: Add daily news artifacts (MD & HTML)"
          default_author: github_actions
