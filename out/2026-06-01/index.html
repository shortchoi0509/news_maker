        .container {
            max-width: 800px;

        h1 {

            background: white;
            border-radius: 8px;

            border-bottom: 1px solid #eee;

            color: #333;
        }
        .file-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item .num {
            color: #999;
            font-weight: bold;
            min-width: 30px;
        }
        .file-item a {
            color: #8b0000;
            text-decoration: none;
            flex: 1;
            word-break: break-word;
        }
        .file-item a:hover { text-decoration: underline; }
        .file-item .ext {
            color: #999;
            font-size: 0.85rem;
        }

</head>
